<!doctype html>
<!--
  ══════════════════════════════════════════════════════════════════════
  YOUR FIRST STREAMPIXEL STREAM — the whole integration in ~15 lines.

  Run it (no build tools needed):
      npx serve public          ← from the repo root, then open
      http://localhost:3000/examples/minimal.html?appId=YOUR_PROJECT_ID

  (Or just open /examples/minimal.html?appId=… on the deployed example.)

  What happens in those 15 lines:
    1. StreamPixel.create() authenticates, gets a session ticket from the
       Streampixel platform, connects to a GPU server, and launches your
       Unreal app. No API keys in the browser — ever.
    2. `loading: true` shows your project's branded loading screen.
    3. The video appears inside <div id="app"> when frames arrive.
    4. state events tell you what's happening; that's ALL the UI you owe.

  When you outgrow this file → src/components/App.js is the full
  reference (password gates, chat, stats, SFU…), and the README
  documents every option, event, and error.
  ══════════════════════════════════════════════════════════════════════
-->
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StreamPixel — minimal example</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    #app { position: fixed; inset: 0; }          /* the stream fills the page */
    #app video { width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { StreamPixel } from '/sdk/streampixel-core.mjs';   // from npm: '@streampixel/core'

    const appId = new URLSearchParams(location.search).get('appId');

    const stream = await StreamPixel.create({
      appId,                                     // your project id from the dashboard
      container: document.getElementById('app'), // where the video goes
      loading: true,                             // built-in branded loading screen
    });

    stream.on('state', (s) => console.log('stream state:', s.kind));
    stream.on('ended', ({ reason }) => alert(`Stream ended: ${reason}`));
  </script>
</body>
</html>
